name: Check and publish plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # macos-14 is an Apple Silicon runner. The build script checks the target.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci --prefix extensions/customer-voice --ignore-scripts
      - name: Check source
        run: |
          python -m unittest discover -s tests -p '*_test.py'
          node --test tests/server.test.mjs tests/dataverse.test.mjs
          for file in extensions/customer-voice/*.mjs scripts/*.mjs tests/*.mjs; do node --check "$file"; done
      - name: Build self-contained plugin
        run: node scripts/build-release.mjs
      - name: Check package without Python or npm
        run: |
          python scripts/make-test-export.py "$RUNNER_TEMP/synthetic.xlsx"
          CUSTOMER_VOICE_TEST_XLSX="$RUNNER_TEMP/synthetic.xlsx" node tests/package-check.mjs
      - name: Check packaged viewer in a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          export CUSTOMER_VOICE_PLUGIN_ROOT="$PWD/dist/plugin"
          node tests/contact-browser-check.mjs
          node tests/live-browser-check.mjs
          node tests/usability-browser-check.mjs
      - name: Upload checked package
        run: tar -C dist/plugin -czf .build/customer-voice-macos-arm64.tar.gz .
      - name: Store checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-voice-macos-arm64
          path: .build/customer-voice-macos-arm64.tar.gz
          include-hidden-files: true
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: customer-voice-macos-arm64
          path: download
      - name: Publish checked package to stable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir plugin
          tar -xzf download/customer-voice-macos-arm64.tar.gz -C plugin
          cd plugin
          test "$(node -p "require('./release.json').sourceCommit")" = "$SOURCE_SHA"
          git init -b stable
          git remote add origin "https://github.com/$REPOSITORY.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          if git ls-remote --exit-code --heads origin stable; then
            git fetch --depth=1 origin stable
            git update-ref refs/heads/stable FETCH_HEAD
          fi
          git add --all --force
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "build: publish checked plugin from $SOURCE_SHA"
          git push origin stable
