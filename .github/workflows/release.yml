name: Check and publish plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: darwin-arm64, python-arch: arm64 }
          - { runner: windows-2025, target: win32-x64, python-arch: x64 }
          # Windows 11 emulates the x64 reader; the Node host remains ARM64.
          - { runner: windows-11-arm, target: win32-arm64, python-arch: x64 }
          - { runner: ubuntu-24.04, target: linux-x64, python-arch: x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, python-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci --prefix extensions/customer-voice --ignore-scripts
      - name: Check source
        env:
          CUSTOMER_VOICE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python -m unittest discover -s tests -p '*_test.py'
          node --test tests/server.test.mjs tests/dataverse.test.mjs
          for file in extensions/customer-voice/*.mjs scripts/*.mjs tests/*.mjs; do node --check "$file"; done
      - name: Build self-contained plugin
        env:
          CUSTOMER_VOICE_BUILD_PYTHON: python
        run: node scripts/build-release.mjs
      - name: Check package without Python or npm
        run: |
          python scripts/make-test-export.py "$RUNNER_TEMP/synthetic.xlsx"
          CUSTOMER_VOICE_TEST_XLSX="$RUNNER_TEMP/synthetic.xlsx" node tests/package-check.mjs
      - name: Check packaged viewer in a browser
        # Chromium does not provide a native Windows ARM64 browser binary.
        if: matrix.target != 'win32-arm64'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          export CUSTOMER_VOICE_PLUGIN_ROOT="$(node -p "process.cwd() + '/dist/plugin'")"
          node tests/contact-browser-check.mjs
          node tests/live-browser-check.mjs
          node tests/usability-browser-check.mjs
      - name: Check Linux portal protocol
        if: startsWith(matrix.target, 'linux-')
        run: dbus-run-session -- python tests/linux-portal-check.py
      - name: Archive checked package
        run: tar -C dist/plugin -czf ".build/customer-voice-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-voice-${{ matrix.target }}
          path: .build/customer-voice-${{ matrix.target }}.tar.gz
          include-hidden-files: true
          retention-days: 14

  linux-compatibility:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        image: ["ubuntu:24.04", "ubuntu:26.04", "fedora:44"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: customer-voice-linux-${{ matrix.arch }}
          path: download
      - name: Check the same package on the target distribution
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/plugin
          tar -xzf "download/customer-voice-linux-$ARCH.tar.gz" -C dist/plugin
          docker run --rm -v "$PWD:/work" -v "$(readlink -f "$(command -v node)"):/usr/local/bin/node:ro" \
            -w /work "$IMAGE" bash scripts/check-linux-distribution.sh

  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node tests/publish-check.mjs

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [package, linux-compatibility, publication-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: customer-voice-*
          merge-multiple: true
          path: download
      - name: Publish checked platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          node scripts/publish-release.mjs
